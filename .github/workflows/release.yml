name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Static binaries: SPIRE server and agent images are distroless, so the plugin must not need libc.
      # SHA256SUMS gives the values for SPIRE's plugin_checksum.
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            for side in server agent; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' \
                -o dist/spire-plugin-oci-$side-linux-$arch ./cmd/$side
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
      # No RUN steps in the Dockerfile, so cross-building arm64 needs no QEMU.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
